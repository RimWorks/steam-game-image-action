name: test

on:
  pull_request:
  workflow_call:

# semantic-release.yml grants write scopes; a called workflow inherits them unless it drops them.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck >/dev/null
          shellcheck scripts/*.sh tests/*.sh
      - name: parser tests
        run: bash tests/test-published-buildid.sh
      - name: actionlint
        run: |
          # pinned: this job gates the release, so an unpinned main-branch script and a
          # floating binary version could both break or poison a publish.
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint
