name: sonar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    uses: RimWorks/mod-ci/.github/workflows/sonar-scan.yml@e4057083e7deb547164d4a749c5ad0abe3a1f907 # v1.11.1
    with:
      project-key: RimWorks_steam-game-image-action
      exclusions: tests/fixtures/**
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
